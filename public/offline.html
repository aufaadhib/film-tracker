<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f14" />
    <title>Offline · Reelmark</title>
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; color: #f5f7fa; background: #0b0f14; font-family: Arial, sans-serif; }
      main { width: min(100%, 460px); padding: 32px; border: 1px solid #273040; border-radius: 20px; background: #121822; box-shadow: 0 24px 70px rgb(0 0 0 / 28%); }
      img { display: block; width: 48px; height: 48px; }
      p:first-of-type { margin: 24px 0 8px; color: #6d8cff; font: 700 11px monospace; letter-spacing: .12em; }
      h1 { margin: 0; font-size: clamp(2.3rem, 11vw, 4rem); line-height: .95; letter-spacing: -.06em; }
      p:last-of-type { margin: 18px 0 26px; color: #aab4c3; line-height: 1.6; }
      a { display: inline-flex; min-height: 48px; align-items: center; padding: 0 18px; border-radius: 12px; color: #071019; background: #55d6a3; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #6d8cff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/reelmark-mark.svg" width="48" height="48" alt="" />
      <p>REELMARK / OFFLINE</p>
      <h1>Koneksi terputus.</h1>
      <p>Riwayat tontonan tetap aman. Sambungkan kembali internet untuk membuka dan menyinkronkan dashboard.</p>
      <a href="/dashboard">Coba lagi</a>
    </main>
  </body>
</html>
